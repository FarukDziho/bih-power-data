name: build-topology
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build BiH topology from Zenodo/PyPSA-Eur
        run: python topology/build_topology.py
      - name: Commit topology outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topology/out
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "topology: rebuild from Zenodo 14144752"
            git pull --rebase origin main
            git push
          fi
